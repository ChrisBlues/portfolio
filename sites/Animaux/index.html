<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css">
    <title>Animaux perso</title>
</head>

<body>
    <section>
        <div class="swiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide">
                    <div class="img-wrapper">
                        <img
                        src="./Images/Colibri.jpg"
                        alt=""
                        data-swiper-parallax-x="30%"
                        loading="lazy">
                    </div>
                    <p>Colibri</p>
                </div>

                <div class="swiper-slide">
                    <div class="img-wrapper">
                        <img
                        src="./Images/Ecureuil.jpg"
                        alt=""
                        data-swiper-parallax-x="30%"
                        loading="lazy">
                    </div>
                    <p>Ecureuil</p>
                </div>

                <div class="swiper-slide">
                    <div class="img-wrapper">
                        <img
                        src="./Images/Cameleon.jpg"
                        alt=""
                        data-swiper-parallax-x="30%"
                        loading="lazy">
                    </div>
                    <p>Caméléon</p>
                </div>

                <div class="swiper-slide">
                    <div class="img-wrapper">
                        <img
                        src="./Images/Lionne_Lionceaux.jpg"
                        alt=""
                        data-swiper-parallax-x="30%"
                        loading="lazy">
                    </div>
                    <p>Lionne et ses lionceaux</p>
                </div>

                <div class="swiper-slide">
                    <div class="img-wrapper">
                        <img
                        src="./Images/Renardeau.jpg"
                        alt=""
                        data-swiper-parallax-x="30%"
                        loading="lazy">
                    </div>
                    <p>Renardeau</p>
                </div>

                <div class="swiper-slide">
                    <div class="img-wrapper">
                        <img
                        src="./Images/Faon.jpg"
                        alt=""
                        data-swiper-parallax-x="30%"
                        loading="lazy">
                    </div>
                    <p>Faon</p>
                </div>

                <div class="swiper-slide">
                    <div class="img-wrapper">
                        <img
                        src="./Images/Grenouilles.jpg"
                        alt=""
                        data-swiper-parallax-x="30%"
                        loading="lazy">
                    </div>
                    <p>Grenouilles</p>
                </div>

                <div class="swiper-slide">
                    <div class="img-wrapper">
                        <img
                        src="./Images/Tigre.jpg"
                        alt=""
                        data-swiper-parallax-x="30%"
                        loading="lazy">
                    </div>
                    <p>Tigre</p>
                </div>

            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
