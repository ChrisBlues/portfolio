<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Ados</title>
</head>


<body>

    <div id="particles-js" class="particles"></div>
    <div class="container">
        <div class="swiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide">
                    <img src="./Images/adrian-newell.jpg" alt="Photo de Adrian Newell">
                    <p>Photo de Adrian Newell</p>
                </div>
                <div class="swiper-slide">
                    <img src="./Images/aedrian-salazar.jpg" alt="Photo de Aedrian Salazar">
                    <p>Photo de Aedrian Salazar</p>
                </div>
                <div class="swiper-slide">
                    <img src="./Images/daniel-lezuch.jpg" alt="Photo de Daniel Lezuch">
                    <p>Photo de Daniel Lezuch</p>
                </div>
                <div class="swiper-slide">
                    <img src="./Images/daniil-onischenko-1.jpg" alt="Photo de Daniil Onischenko">
                    <p>Photo de Daniil Onischenko</p>
                </div>
                <div class="swiper-slide">
                    <img src="./Images/daniil-onischenko-2.jpg" alt="Photo de Daniel Lezuch">
                    <p>Photo de Daniil Onischenko</p>
                </div>
                <div class="swiper-slide">
                    <img src="./Images/erfan-rahi.jpg" alt="Photo de Erfan Rahi">
                    <p>Photo de Erfan Rahi</p>
                </div>
                <div class="swiper-slide">
                    <img src="./Images/martin-martz.jpg" alt="Photo de Martin Martz">
                    <p>Photo de Martin Martz</p>
                </div>
                <div class="swiper-slide">
                    <img src="./Images/omid-armin.jpg" alt="Photo de Omid Armin">
                    <p>Photo de Omid Armin</p>
                </div>
                <div class="swiper-slide">
                    <img src="./Images/Kateryna-Hliznitsova.jpg" alt="Photo de Kateryna Hliznitsova">
                    <p>Photo de Kateryna Hliznitsova</p>
                </div>
            </div>
            <div class="swiper-pagination"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
