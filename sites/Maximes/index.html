<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Maximes de vie</title>
</head>


<body>
    <div class="slider-container">

                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="image-wrapper">
                        <img src="./Images/img-2.jpg" alt="Restez équilibré" loading="lazy">
                    </div>
                    <div class="container">
                        <h1>Restez équilibré</h1>
                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="image-wrapper">
                        <img src="./Images/img-3.jpg" alt="Assouvissez votre passion" loading="lazy">
                    </div>
                    <div class="container">
                        <h1>Assouvissez votre passion</h1>
                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="image-wrapper">
                        <img src="./Images/img-4.jpg" alt="Améliorez vos compétences" loading="lazy">
                    </div>
                    <div class="container">
                        <h1>Améliorez vos compétences</h1>
                    </div>
                </div>

                <div class="swiper-slide">

                        <h1>Renforcez vos relations</h1>
                    </div>
                </div>

                        <h1>Evitez la négativité</h1>
                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="image-wrapper">

                    </div>
                    <div class="container">
                        <h1>Fuyez le confort</h1>

                </div>

                    <div class="container">
                        <h1>Voyagez plus souvent</h1>

        <!-- Remerciements -->
        <div class="footer_merci">
            Remerciements à Ecem Gokdogan, la conceptrice de ce tutoriel à consulter sur YouTube
            <a href="https://www.youtube.com/watch?v=5ypdljwPUZI" target="_blank">ici</a> - Chris Blues -
        </div>




        <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
        <script src="app.js"></script>

</html>
