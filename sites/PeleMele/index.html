<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--  ============= Code Swiper CSS ============= -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <!--  ============= Code style.CSS ============= -->
    <link rel="stylesheet" href="style.css">

    <title>Pêle-mêle</title>
</head>

<body>
    <section class="container">
        <!-- Slider main container -->
        <div class="swiper">
            <!-- Additional required wrapper -->
            <div class="swiper-wrapper">

                <!-- Slides -->
                <div class="swiper-slide">
                    <img src="./assets/AmbianceEstivale.jpg" alt="Ambiance estivale">
                    <div class="caption">
                        <h1>Ambiance estivale</h1>
                        <ion-icon name="heart" class="like-btn"></ion-icon>
                    </div>
                </div>

                <div class="swiper-slide">
                    <img src="./assets/Honfleur.jpg" alt="Honfleur">
                    <div class="caption">
                        <h1>Honfleur</h1>
                        <ion-icon name="heart" class="like-btn"></ion-icon>
                    </div>
                </div>

                <div class="swiper-slide">
                    <img src="./assets/Pumpkins.jpg" alt="Pumpkins">
                    <div class="caption">
                        <h1>Pumpkins season</h1>
                        <ion-icon name="heart" class="like-btn"></ion-icon>
                    </div>
                </div>

                <div class="swiper-slide">
                    <img src="./assets/Halloween.png" alt="Halloween">
                    <div class="caption">
                        <h1>Halloween</h1>
                        <ion-icon name="heart" class="like-btn"></ion-icon>
                    </div>
                </div>

                <div class="swiper-slide">
                    <img src="./assets/Tournesol.jpg" alt="Tournesol">
                    <div class="caption">
                        <h1>Tournesol en herbe</h1>
                        <ion-icon name="heart" class="like-btn"></ion-icon>
                    </div>
                </div>

                <div class="swiper-slide">
                    <img src="./assets/Agrumes&Cadre.jpg" alt="Agrumes et cadre">
                    <div class="caption">
                        <h1>Agrumes en cadre</h1>
                        <ion-icon name="heart" class="like-btn"></ion-icon>
                    </div>
                </div>

                <div class="swiper-slide">
                    <img src="./assets/Carrousel.jpg" alt="Carrousel">
                    <div class="caption">
                        <h1>Carrousel en folie</h1>
                        <ion-icon name="heart" class="like-btn"></ion-icon>
                    </div>
                </div>

                <div class="swiper-slide">
                    <img src="./assets/PetitDej.jpg" alt="Petit-déj'">
                    <div class="caption">
                        <h1>Petit-déj'</h1>
                        <ion-icon name="heart" class="like-btn"></ion-icon>
                    </div>
                </div>

                <div class="swiper-slide">
                    <img src="./assets/Chapeau&Fraicheur.jpg" alt="Chapeau & fraîcheur">
                    <div class="caption">
                        <h1>Chapeau & fraîcheur</h1>
                        <ion-icon name="heart" class="like-btn"></ion-icon>
                    </div>
                </div>

                <div class="swiper-slide">
                    <img src="./assets/Ombre&Lumiere.jpg" alt="Ombre & lumière">
                    <div class="caption">
                        <h1>Ombre & lumière</h1>
                        <ion-icon name="heart" class="like-btn"></ion-icon>
                    </div>
                </div>

                <div class="swiper-slide">
                    <img src="./assets/Mirabelles.jpg" alt="Mirabelles">
                    <div class="caption">
                        <h1>Mirabelles</h1>
                        <ion-icon name="heart" class="like-btn"></ion-icon>
                    </div>
                </div>

                <div class="swiper-slide">
                    <img src="./assets/TourEiffel.jpg" alt="Tour Eiffel">
                    <div class="caption">
                        <h1>Tour Eiffel</h1>
                        <ion-icon name="heart" class="like-btn"></ion-icon>
                    </div>
                </div>

            </div>

        </div>
    </section>

    <!--  ============= Code Swiper.js ============= -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!--  ============= Code app.js pour Javascript ============= -->
    <script src="app.js"></script>

    <!-- ============= Codes ionicons ============= -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>

</html>
